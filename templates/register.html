{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h3 class="card-title text-center mb-4">Register Account</h3>
      <form method="POST">
        <div class="mb-3">
          <label>Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>GTU Enrollment Number</label>
          <input type="text" name="enrollment_no" class="form-control" required>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label>Department</label>
            <select name="department" class="form-select">
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
          </div>
          <div class="col">
            <label>Semester</label>
            <select name="semester" class="form-select">
              {% for i in range(1, 9) %}
                <option value="{{ i }}" {% if i == 5 %}selected{% endif %}>Sem {{ i }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
