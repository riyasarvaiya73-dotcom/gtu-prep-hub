{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h3 class="card-title mb-4">Add GTU Subject</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">GTU Subject Code</label>
          <input type="text" name="code" class="form-control" placeholder="e.g. 3170716" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Subject Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Cloud Computing" required>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Department</label>
            <select name="department" class="form-select">
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
          </div>
          <div class="col">
            <label class="form-label">Semester</label>
            <select name="semester" class="form-select">
              {% for i in range(1, 9) %}
                <option value="{{ i }}">Semester {{ i }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Create & Continue to Units &rarr;</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
